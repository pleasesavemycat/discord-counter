# Builds the container image and publishes it to GHCR so the NAS can install
# it through the Docker app with no shell and no local build.
name: Publish container image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest` tracks main so the NAS can just re-pull; the sha and
          # version tags give you something specific to roll back to.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          # The NASync DXP line is x86_64; no other target is worth the build time.
          platforms: linux/amd64
          push: true
          # Publish a plain manifest, not an OCI index with an attestation
          # entry beside it. We only build one platform, so the index buys
          # nothing, and NAS Docker daemons are often old enough to trip over
          # the unknown/unknown attestation child or surface it as a phantom
          # image in the UI.
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
